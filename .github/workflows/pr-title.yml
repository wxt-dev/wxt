name: 🛡️ Check PR Title

on:
  pull_request:
    types: [opened, edited]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HELP_URL: https://github.com/wxt-dev/wxt/blob/main/CONTRIBUTING.md#conventional-commits--pr-titles
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert)(\([^()]+\))?!?: [^ ].*[^.]$'
          if [[ ! "$PR_TITLE" =~ $pattern ]] || [ "${#PR_TITLE}" -gt 100 ]; then
            echo "::error::Invalid PR title: \"$PR_TITLE\""
            echo "Expected: <type>(<optional scope>): <subject>"
            echo "  - type is one of: build, chore, ci, docs, feat, fix, perf, refactor, revert"
            echo "  - the subject must not end with a period"
            echo "  - the whole title must be at most 100 characters"
            echo "See $HELP_URL"
            exit 1
          fi
