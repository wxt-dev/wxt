name: 📼 VHS
on:
  push:
    branches: [main]
    paths:
      - docs/tapes/*.tape
      - .github/workflows/vhs.yml
  pull_request:
    paths:
      - docs/tapes/*.tape
      - .github/workflows/vhs.yml
  workflow_dispatch:

permissions:
  contents: read

# A push to a PR branch fires both `push` and `pull_request` events. Keep only
# one run alive per branch so both don't record and commit the GIF.
concurrency:
  group: vhs-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vhs:
    name: Create VHS
    runs-on: macos-latest
    if: ${{ github.actor != 'github-actions[bot]' && github.repository == 'wxt-dev/wxt' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Go
        uses: actions/setup-go@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          go-version: '1.25.1'

      # This prevents bunx from downloading WXT in the video, and it uses the checked-out version
      - name: Build WXT
        working-directory: packages/wxt
        run: bun run build

      - name: Record VHS
        run: |
          brew install ttyd ffmpeg
          go install github.com/charmbracelet/vhs@517bcda0faf416728bcf6b7fe489eb0e2469d9b5 # v0.10.0
          vhs docs/tapes/init-demo.tape

      - name: Save recorded GIF
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'docs: Update `wxt init` GIF'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          # https://github.com/charmbracelet/vhs#output
          file_pattern: 'docs/assets/*.gif'
