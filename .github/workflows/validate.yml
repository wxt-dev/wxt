name: 🛡️ Validate
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Match Vite Task's default; override per-job if a runner has more cores.
# https://viteplus.dev/guide/run#concurrency
env:
  VP_RUN_CONCURRENCY_LIMIT: 4

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build All Packages
        run: vpr -r build

      - name: Verify Generated Virtual Modules
        run: |
          if ! git diff --exit-code -- packages/wxt/src/internal-utils/virtual-modules.ts; then
            echo "::error file=packages/wxt/src/internal-utils/virtual-modules.ts::virtual-modules.ts is out of date. Run 'vp run build' in packages/wxt (or from the root: 'vpr -r build') and commit the updated file."
            exit 1
          fi

      - name: Generate Docs
        run: vpr docs:gen

      - name: Basic Checks
        run: vpr check

  builds:
    name: Builds
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build All Packages
        run: vpr -r build

  build-demo:
    name: Build Demo
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: vpr build:all
        working-directory: packages/wxt-demo

      - name: ZIP
        run: vp exec wxt zip
        working-directory: packages/wxt-demo

  linux-tests-shard:
    name: Tests (Linux, ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10

      - name: Run Tests
        run: vp test --shard=${{ matrix.shard }} --passWithNoTests --reporter=default --reporter=hanging-process

  # Required status check: passes only if every shard passed.
  linux-tests:
    name: Tests (Linux)
    needs: linux-tests-shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check Shard Results
        run: '[ "${{ needs.linux-tests-shard.result }}" = "success" ]'

  windows-tests-shard:
    name: Tests (Windows, ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10

      - name: Run Tests
        run: vp test --shard=${{ matrix.shard }} --passWithNoTests

  # Required status check: passes only if every shard passed.
  windows-tests:
    name: Tests (Windows)
    needs: windows-tests-shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check Shard Results
        run: '[ "${{ needs.windows-tests-shard.result }}" = "success" ]'

  template:
    name: Template
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        template:
          - react
          - solid
          - svelte
          - vanilla
          - vue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          postinstall: 'false'

      - name: Pack WXT package
        run: vp pm pack
        working-directory: packages/wxt

      - name: Install Dependencies
        run: npm i
        working-directory: templates/${{ matrix.template }}

      - name: Install Packed WXT
        run: npm i -D ../../packages/wxt/wxt-*.tgz
        working-directory: templates/${{ matrix.template }}

      - name: Type Check Template
        run: bun run compile
        if: matrix.template != 'svelte'
        working-directory: templates/${{ matrix.template }}

      - name: Type Check Template
        run: bun run check
        if: matrix.template == 'svelte'
        working-directory: templates/${{ matrix.template }}

      - name: Build Template
        run: bun run build
        working-directory: templates/${{ matrix.template }}
