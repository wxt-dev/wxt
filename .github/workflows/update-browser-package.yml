name: 🔄 Update @wxt-dev/browser
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight

permissions:
  contents: read

jobs:
  sync:
    name: 'Sync with @types/chrome'
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wxt-dev'
    permissions:
      contents: write # Push version changes
      id-token: write # OIDC for NPM publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          postinstall: 'false'

      - name: Generate Latest Code
        working-directory: packages/browser
        run: bun run gen

      - name: Run Checks
        working-directory: packages/browser
        run: bun run check

      - name: Commit Changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'fix: Upgrade `@wxt-dev/browser` to latest `@types/chrome` version'

      - name: Publish to NPM
        if: steps.commit.outputs.changes_detected == 'true'
        working-directory: packages/browser
        run: |
          bun pm pack
          sudo npm i -g npm@latest
          npm publish *.tgz
