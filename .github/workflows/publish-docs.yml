name: 📝 Publish Docs
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Image Tag
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    # Only run if it's the upstream repository, not forks
    if: github.repository == 'wxt-dev/wxt'
    name: Publish Docs
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Login to Docker Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: https://${{ secrets.DOCKER_REGISTRY_HOSTNAME }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build docs
        run: |
          bun run docs:build
          docker build docs/.vitepress -t ${{ secrets.DOCKER_REGISTRY_HOSTNAME }}/wxt/docs:${{ github.event.inputs.tag || 'latest' }}

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_REGISTRY_HOSTNAME }}/wxt/docs:${{ github.event.inputs.tag || 'latest' }}

      - name: Deploy
        run: 'curl -X POST -i -H "$DEPLOY_HEADER" "$DEPLOY_URL"'
        env:
          DEPLOY_HEADER: ${{ secrets.DOCS_DEPLOY_HEADER }}
          DEPLOY_URL: ${{ secrets.DOCS_DEPLOY_URL }}
