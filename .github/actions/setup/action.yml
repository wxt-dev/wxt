name: Basic Setup
description: Install Vite+ toolchain and dependencies

inputs:
  install:
    default: 'true'
    description: Whether or not to install dependencies
  postinstall:
    default: 'true'
    description: Whether or not to run workspace `postinstall` tasks (build packages and `wxt prepare`)

runs:
  using: composite

  steps:
    - name: 💾 Put Bun/Vite+ caches on workspace drive (Windows)
      if: ${{ inputs.install == 'true' && runner.os == 'Windows' }}
      shell: bash
      run: |
        echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> $GITHUB_ENV
        echo "VP_HOME=$RUNNER_TEMP/vite-plus" >> $GITHUB_ENV

    # setup-vp installs Vite+, Node, and the package manager (bun), and can
    # cache them. See https://viteplus.dev/guide/ci#github-actions
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        version: '1.7.0'
        node-version-file: .tool-versions
        cache: true
        cache-toolchain: true
        run-install: false

    # Lifecycle scripts are skipped here and the workspace `postinstall`
    # scripts are run below, in parallel, only when a job needs them.
    - name: 📦 Install Dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: vp install --frozen-lockfile --ignore-scripts

    - name: 🗄️ Vite Task cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-

    - name: 🔧 Run Workspace Postinstall
      if: ${{ inputs.install == 'true' && inputs.postinstall == 'true' }}
      shell: bash
      run: node scripts/postinstall.mjs
