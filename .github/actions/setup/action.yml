name: Basic Setup
description: Install Bun and dependencies

inputs:
  install:
    default: 'true'
    description: Whether or not to run 'bun install'

runs:
  using: composite

  steps:
    - name: 🛠️ Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: '.tool-versions'

    - name: 🔍 Get Bun cache path
      if: ${{ inputs.install == 'true' }}
      id: bun-cache
      shell: bash
      run: echo "path=$(bun pm cache)" >> $GITHUB_OUTPUT

    - name: 📦 Cache Bun store
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.bun-cache.outputs.path }}
        key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock') }}

    - name: 📦 Cache buildc
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .cache/packages
        key: ${{ runner.os }}-buildc-${{ hashFiles('bun.lock') }}

    - name: 📦 Install Dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: bun ci ${{ inputs.installArgs }}
