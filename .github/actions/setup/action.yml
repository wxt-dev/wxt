name: Basic Setup
description: Install Bun and dependencies

inputs:
  install:
    default: 'true'
    description: Whether or not to run 'bun install'

runs:
  using: composite

  steps:
    - name: 🛠️ Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: '.tool-versions'

    - uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version-file: .tool-versions
        cache: true

    - name: 📦 Install Dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.installArgs }}
      run: vp install --frozen-lockfile $INSTALL_ARGS

    # Experimental: reuse Vite Task results across CI runs.
    # https://viteplus.dev/guide/github-actions-cache
    # Restore after install so package installation can recreate node_modules first.
    - name: 🗄️ Vite Task cache
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-
